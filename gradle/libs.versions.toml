# libs.versions.toml
[versions]
agp = "8.13.2"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.7.0"
material = "1.12.0" # Updated to latest stable as discussed
activity = "1.8.0"
constraintlayout = "2.1.4"
mathview = "0.0.6"
# playServicesAds = "23.0.0"         <-- REMOVED
kotlin = "2.0.0"
coreKtx = "1.13.1"
uiDesktop = "1.6.7"
# playServicesMeasurementApi = "23.0.0" <-- REMOVED

[libraries]
core = { module = "androidx.core:core", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }             <-- REMOVED
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
ui-desktop = { group = "androidx.compose.ui", name = "ui-desktop", version.ref = "uiDesktop" }
# play-services-measurement-api = { group = "com.google.android.gms", name = "play-services-measurement-api", version.ref = "playServicesMeasurementApi" } <-- REMOVED

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }